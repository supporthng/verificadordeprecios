<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Consulta de Precios</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono-192.png">
<link rel="preload" href="fuentes/Sora.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="estilos.css">
</head>
<body class="estilo-claro logo-esquina">
<!-- Cuadro del escáner: siempre activo y con el cursor, visible u oculto según Apariencia. -->
<input id="lector" class="lector oculto" type="text" inputmode="none" autocomplete="off"
       autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"
       aria-label="Código de barras" placeholder="Escanea o escribe el código y pulsa Enter">

<!-- Estilo "Panel lateral": franja fija con logo, nombre y QR. -->
<aside id="panel" class="panel" hidden>
  <div class="panel-marca">
    <img id="panel-logo" class="panel-logo chip" alt="Logo de la tienda" hidden>
    <p id="panel-nombre" class="panel-nombre" hidden></p>
  </div>
  <figure id="panel-qr" class="panel-qr" hidden>
    <img id="panel-qr-img" alt="Código QR para consultar precios desde el celular">
    <figcaption id="panel-qr-texto"></figcaption>
  </figure>
</aside>

<main id="espera" class="espera" hidden>
  <header id="cabecera" class="cabecera">
    <img id="logo" class="cabecera-logo" alt="Logo de la tienda" hidden>
    <span id="nombre-negocio" class="cabecera-nombre" hidden></span>
  </header>
  <section class="espera-centro">
    <h1 id="titulo" class="titulo">Escanea tu producto</h1>
    <div id="tarjeta-codigo" class="laser" aria-hidden="true"><span class="laser-haz"></span></div>
    <p id="pista" class="pista">Pasa el código de barras por el lector</p>
  </section>
  <aside id="qr" class="espera-qr" hidden>
    <span id="qr-texto">Consulta también desde tu celular</span>
    <img id="qr-img" class="chip" alt="Código QR para consultar precios desde el celular">
  </aside>
</main>

<main id="resultado" class="resultado" hidden>
  <header id="resultado-cabecera" class="resultado-cabecera">
    <img id="resultado-logo" class="resultado-logo" alt="" hidden>
    <span id="resultado-negocio" hidden></span>
  </header>
  <figure id="foto-caja" class="resultado-foto" hidden><img id="foto" alt=""></figure>
  <section class="resultado-producto">
    <p id="nombre" class="resultado-nombre"></p>
    <p class="resultado-codigo">Código <span id="codigo"></span></p>
  </section>
  <p class="etiqueta" aria-label="Precio">
    <span id="moneda" class="etiqueta-moneda">RD$</span><span id="precio" class="etiqueta-entero"></span><span id="centavos" class="etiqueta-centavos"></span>
  </p>
  <div class="cuenta" aria-hidden="true"><span id="cuenta-barra"></span></div>
</main>
<div class="riel" aria-hidden="true"></div>

<!-- Primera vez: vincular el equipo, descargar precios, o avisar que falta internet. -->
<section id="aviso" class="aviso" hidden>
  <div class="aviso-caja">
    <div class="aviso-icono" id="aviso-icono">⏳</div>
    <h2 id="aviso-titulo"></h2>
    <p id="aviso-texto"></p>
    <form id="form-vincular" hidden>
      <input id="enlace" type="url" placeholder="Pega aquí el enlace de instalación" autocomplete="off">
      <button type="submit">Vincular este equipo</button>
      <p id="enlace-error" class="error"></p>
    </form>
  </div>
</section>

<!-- ⚙ configuración (con clave) · ✕ cerrar la app (con clave; solo dentro de las apps) -->
<button id="boton-salida" class="boton-esquina" type="button" aria-label="Configuración del verificador" title="Configuración">
  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94a7.07 7.07 0 0 0 .05-.94 7.07 7.07 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.63l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7 7 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54a7 7 0 0 0-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.85a.5.5 0 0 0 .12.63l2.03 1.58a7.4 7.4 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.63l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.5.39 1.05.71 1.63.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54a7 7 0 0 0 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.63zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg>
</button>
<button id="boton-cerrar" class="boton-esquina boton-cerrar" type="button" aria-label="Cerrar la aplicación" title="Cerrar la aplicación" hidden>✕</button>
<div id="estado-red" class="estado-red" aria-live="polite"></div>

<dialog id="dlg-clave">
  <form id="form-clave" method="dialog">
    <h2 id="clave-titulo">🔐 Clave de administrador</h2>
    <p id="clave-texto" class="suave">Escribe la clave de salida del verificador.</p>
    <input id="clave" type="password" autocomplete="off" aria-label="Clave de salida">
    <p id="clave-error" class="error"></p>
    <div class="botones">
      <button type="button" id="clave-cancelar" class="secundario">Cancelar</button>
      <button type="submit" id="clave-entrar">Entrar</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-menu">
  <h2>⚙️ Verificador sin internet</h2>
  <p id="menu-aviso" class="aviso-amarillo" hidden></p>
  <dl id="menu-estado" class="estado-lista"></dl>
  <form id="form-nombre" class="fila-nombre">
    <input id="nombre-equipo" type="text" maxlength="40" autocomplete="off" aria-label="Nombre de este equipo"
           placeholder="Nombre de este equipo (ej.: Pasillo 3)">
    <button type="submit" class="secundario">Guardar</button>
  </form>
  <form id="form-sucursal" class="fila-nombre" hidden>
    <select id="sucursal-equipo" aria-label="Sucursal de este equipo"></select>
    <button type="submit" class="secundario">Cambiar sucursal</button>
  </form>
  <div class="botones-menu">
    <button type="button" id="m-actualizar">🔄 Actualizar precios y pantalla</button>
    <button type="button" id="m-completa">⛶ Pantalla completa y volver</button>
    <a id="m-en-linea" class="boton" target="_blank" rel="noopener" hidden>🌐 Abrir la app en línea</a>
    <button type="button" id="m-app-buscar" hidden>📲 Buscar actualización de la app</button>
    <button type="button" id="m-marco" class="principal" hidden>⬇️ Actualizar la app</button>
    <button type="button" id="m-fijar" hidden>📌 Fijar la app en pantalla (bloqueo)</button>
    <button type="button" id="m-botones" class="principal" hidden>🔒 Bloquear los botones de Android</button>
    <button type="button" id="m-inicio" hidden>🏠 Cambiar la pantalla de inicio de Android</button>
    <button type="button" id="m-cerrar" class="peligro">⏻ Cerrar aplicación</button>
    <button type="button" id="m-desvincular" class="peligro">🔗 Desvincular este equipo</button>
    <button type="button" id="m-volver" class="principal">🏷️ Volver al verificador</button>
  </div>
  <p id="menu-mensaje" class="suave"></p>
</dialog>

<script src="config.js"></script>
<script src="codigos.js"></script>
<script src="datos.js"></script>
<script src="pantalla.js"></script>
<script src="app.js"></script>
</body>
</html>
